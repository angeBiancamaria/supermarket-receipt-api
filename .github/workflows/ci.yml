name: CI

on:
  push:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verification:
    name: ${{ matrix.check }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        check: [lint, format, tests]

    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Installer uv
        uses: astral-sh/setup-uv@v6

      - name: Installer les dependances
        run: uv sync --locked

      - name: Lint
        if: matrix.check == 'lint'
        run: uv run ruff check .

      - name: Format
        if: matrix.check == 'format'
        run: uv run ruff format --check .

      - name: Tests avec couverture
        if: matrix.check == 'tests'
        run: uv run pytest tests/unit tests/integration -v --cov=supermarket_receipt_api --cov-report=term-missing
