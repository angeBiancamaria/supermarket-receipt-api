name: CI

on:
  push:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verification:
    name: ${{ matrix.check }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        check: [lint, format, tests]

    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Installer uv
        uses: astral-sh/setup-uv@v6

      - name: Installer les dependances
        run: uv sync --locked

      - name: Lint
        if: matrix.check == 'lint'
        run: uv run ruff check .

      - name: Format
        if: matrix.check == 'format'
        run: uv run ruff format --check .

      - name: Tests avec rapport
        if: matrix.check == 'tests'
        run: |
          uv run pytest tests/unit tests/integration -v --cov=supermarket_receipt_api --cov-report=xml:coverage.xml --junitxml=report.xml

      - name: Upload rapport
        if: always() && matrix.check == 'tests'
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            coverage.xml
            report.xml
          if-no-files-found: warn

  build:
    name: Build package
    needs: verification
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Installer uv
        uses: astral-sh/setup-uv@v6

      - name: Installer les dependances
        run: uv sync --locked

      - name: Construire le package
        run: uv build

      - name: Publier dist
        uses: actions/upload-artifact@v4
        with:
          name: python-package
          path: dist/
          if-no-files-found: error
